services:
  - type: web
    name: face-attendance
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: attendance-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DB_PATH
        value: /var/data/attendance_system.db
      - key: FACE_RECOGNITION_THRESHOLD
        value: "0.80"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
