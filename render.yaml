services:
  - type: web
    name: face-attendance
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --timeout 120 --workers 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FACE_RECOGNITION_THRESHOLD
        value: "12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.13
