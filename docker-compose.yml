version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: face_attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Flask Backend ───────────────────────────────────────────────
  backend:
    image: utkarsh271/face-attendance-backend:latest
    build: ./backend
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/face_attendance
      SECRET_KEY: change-me-in-production
      JWT_SECRET_KEY: jwt-secret-change-me
      JWT_TOKEN_HOURS: "24"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "5001:5000"

  # ── React Frontend ─────────────────────────────────────────────
  frontend:
    image: utkarsh271/face-attendance-frontend:latest
    build: ./frontend
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
