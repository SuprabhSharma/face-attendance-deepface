<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceAttend — Smart Attendance System{% endblock %}</title>

    <!-- ── PWA Manifest ── -->
    <link rel="manifest" href="/manifest.json">

    <!-- ── PWA / Mobile Meta Tags ── -->
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FaceAttend">
    <meta name="application-name" content="FaceAttend">
    <meta name="msapplication-TileColor" content="#2563eb">
    <meta name="msapplication-TileImage" content="{{ url_for('static', filename='img/logo.png') }}">

    <!-- ── SEO Meta ── -->
    <meta name="description" content="AI-powered face recognition attendance system. Mark corporate attendance in seconds using your webcam.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/logo.png') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

<!-- ── PWA Install Banner ── -->
<!-- Desktop: bottom-right corner | Mobile: top-right corner -->
<style>
#pwaInstallBanner {
    position: fixed;
    z-index: 9999;
    width: min(340px, calc(100vw - 2rem));
    /* Desktop: bottom-right */
    bottom: 1.5rem;
    right: 1.5rem;
    top: auto;
    left: auto;
    transform: none;
    animation: pwaSlideIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes pwaSlideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
}
/* Mobile: top-right corner */
@media (max-width: 768px) {
    #pwaInstallBanner {
        top: 1rem;
        right: 1rem;
        bottom: auto;
        left: auto;
        width: min(300px, calc(100vw - 2rem));
        animation: pwaSlideDown 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes pwaSlideDown {
        from { opacity: 0; transform: translateY(-20px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0)     scale(1); }
    }
}
</style>
<div id="pwaInstallBanner" class="d-none">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden position-relative" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); border: 1px solid rgba(255,255,255,0.2) !important;">
        <!-- Clear Close Button in Top Corner -->
        <button type="button" id="pwaDismissBtn" class="btn-close btn-close-white position-absolute top-0 end-0 m-2" style="font-size: 0.75rem; z-index: 10;" aria-label="Close" title="Don't show again"></button>

        <div class="card-body p-3">
            <div class="d-flex align-items-center gap-3 mb-2">
                <img src="{{ url_for('static', filename='img/logo.png') }}" style="width:42px;height:42px;border-radius:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.2);" alt="FaceAttend">
                <div class="flex-grow-1 min-width-0 pe-3">
                    <div class="text-white fw-bold" style="font-size:0.9rem;line-height:1.2;">Install FaceAttend</div>
                    <div class="text-white text-opacity-75" style="font-size:0.75rem;">Fast 1-tap camera access</div>
                </div>
            </div>
            
            <div class="d-flex align-items-center justify-content-end gap-2 pt-1">
                <button type="button" id="pwaNotNowBtn" class="btn btn-sm btn-link text-white text-opacity-75 text-decoration-none py-1 px-2" style="font-size:0.8rem;">
                    Not Now
                </button>
                <button type="button" id="pwaInstallBtn" class="btn btn-sm btn-light text-primary fw-bold rounded-pill px-3 py-1 shadow-sm" style="font-size:0.82rem;">
                    <i class="bi bi-download me-1"></i>Install App
                </button>
            </div>
        </div>
    </div>
</div>
    <div class="app-shell d-flex" style="min-height: 100vh;">
        <!-- Sidebar Navigation -->
        {% include 'sidebar.html' %}

        <div id="sidebarBackdrop" class="sidebar-backdrop d-lg-none"></div>
        
        <!-- Main Content Area -->
        <div class="main-shell flex-grow-1 d-flex flex-column">
            <!-- Top Navbar -->
            {% include 'navbar.html' %}
            
            <!-- Page Content -->
            <main class="flex-grow-1 overflow-auto">
                <div class="container-fluid py-4">
                    {% block content %}{% endblock %}
                </div>
            </main>
            
            <!-- Footer -->
            <footer class="bg-white border-top border-light py-3 mt-auto">
                <div class="container-fluid text-center text-muted small">
                    <p class="mb-0">&copy; 2026 Face Recognition Attendance System. All rights reserved.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Toast Container for Notifications -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('appSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const toggleBtn = document.getElementById('sidebarToggle');

            if (!sidebar || !backdrop || !toggleBtn) {
                return;
            }

            function closeSidebar() {
                sidebar.classList.remove('show');
                backdrop.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            }

            function openSidebar() {
                sidebar.classList.add('show');
                backdrop.classList.add('show');
                document.body.classList.add('sidebar-open');
            }

            toggleBtn.addEventListener('click', () => {
                if (sidebar.classList.contains('show')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            backdrop.addEventListener('click', closeSidebar);

            sidebar.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 992) {
                        closeSidebar();
                    }
                });
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 992) {
                    closeSidebar();
                }
            });
        });
    </script>

    <!-- ── PWA: Service Worker Registration + Install Prompt ── -->
    <script>
    // 1. Register service worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('[PWA] Service Worker registered, scope:', reg.scope))
                .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });
    }

    // 2. Capture install prompt & enforce dismissal persistence
    let _pwaInstallPrompt = null;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn    = document.getElementById('pwaInstallBtn');
    const dismissBtn    = document.getElementById('pwaDismissBtn');
    const notNowBtn     = document.getElementById('pwaNotNowBtn');

    function isPwaDismissed() {
        if (sessionStorage.getItem('pwa-dismissed')) return true;
        const dismissedTime = localStorage.getItem('pwa-dismissed-time');
        if (dismissedTime) {
            // Dismissed within last 7 days -> don't show on refresh
            const daysPassed = (Date.now() - parseInt(dismissedTime, 10)) / (1000 * 60 * 60 * 24);
            if (daysPassed < 7) return true;
        }
        return false;
    }

    function dismissPwaBanner() {
        if (installBanner) {
            installBanner.classList.add('d-none');
        }
        sessionStorage.setItem('pwa-dismissed', '1');
        localStorage.setItem('pwa-dismissed-time', Date.now().toString());
        _pwaInstallPrompt = null;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        _pwaInstallPrompt = e;
        // Never show if user already dismissed or closed it
        if (!isPwaDismissed()) {
            installBanner?.classList.remove('d-none');
        }
    });

    // 3. Install button click — trigger native prompt
    installBtn?.addEventListener('click', async () => {
        if (!_pwaInstallPrompt) return;
        installBanner?.classList.add('d-none');
        const { outcome } = await _pwaInstallPrompt.prompt();
        console.log('[PWA] Install outcome:', outcome);
        if (outcome === 'accepted') {
            localStorage.setItem('pwa-installed', '1');
        } else {
            dismissPwaBanner();
        }
        _pwaInstallPrompt = null;
    });

    // 4. Close ('X') & 'Not Now' buttons — guaranteed dismissal
    dismissBtn?.addEventListener('click', dismissPwaBanner);
    notNowBtn?.addEventListener('click', dismissPwaBanner);

    // 5. Hide banner once user successfully installs
    window.addEventListener('appinstalled', () => {
        installBanner?.classList.add('d-none');
        localStorage.setItem('pwa-installed', '1');
        _pwaInstallPrompt = null;
        console.log('[PWA] FaceAttend installed successfully!');
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
