<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceAttend — Smart Attendance System{% endblock %}</title>

    <!-- ── PWA Manifest ── -->
    <link rel="manifest" href="/manifest.json">

    <!-- ── PWA / Mobile Meta Tags ── -->
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FaceAttend">
    <meta name="application-name" content="FaceAttend">
    <meta name="msapplication-TileColor" content="#2563eb">
    <meta name="msapplication-TileImage" content="{{ url_for('static', filename='img/logo.png') }}">

    <!-- ── SEO Meta ── -->
    <meta name="description" content="AI-powered face recognition attendance system. Mark corporate attendance in seconds using your webcam.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/logo.png') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">

<!-- ── PWA Install Banner (non-intrusive, only shown by browser prompt) ── -->
<div id="pwaInstallBanner" class="d-none" style="position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:9999;width:min(420px,calc(100vw - 2rem));">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-body p-3 d-flex align-items-center gap-3" style="background:linear-gradient(135deg,#1e40af 0%,#2563eb 100%);">
            <img src="{{ url_for('static', filename='img/logo.png') }}" style="width:46px;height:46px;border-radius:12px;flex-shrink:0;" alt="FaceAttend">
            <div class="flex-grow-1">
                <div class="text-white fw-bold" style="font-size:0.92rem;">Install FaceAttend App</div>
                <div class="text-white text-opacity-75" style="font-size:0.78rem;">Add to Home Screen for instant access</div>
            </div>
            <div class="d-flex gap-2 flex-shrink-0">
                <button id="pwaInstallBtn" class="btn btn-sm btn-light fw-semibold rounded-3 px-3" style="font-size:0.8rem;">
                    <i class="bi bi-download me-1"></i>Install
                </button>
                <button id="pwaDismissBtn" class="btn btn-sm btn-link text-white text-opacity-50 p-0" title="Dismiss" style="font-size:1.1rem;line-height:1;">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
    </div>
</div>
    <div class="app-shell d-flex" style="min-height: 100vh;">
        <!-- Sidebar Navigation -->
        {% include 'sidebar.html' %}

        <div id="sidebarBackdrop" class="sidebar-backdrop d-lg-none"></div>
        
        <!-- Main Content Area -->
        <div class="main-shell flex-grow-1 d-flex flex-column">
            <!-- Top Navbar -->
            {% include 'navbar.html' %}
            
            <!-- Page Content -->
            <main class="flex-grow-1 overflow-auto">
                <div class="container-fluid py-4">
                    {% block content %}{% endblock %}
                </div>
            </main>
            
            <!-- Footer -->
            <footer class="bg-white border-top border-light py-3 mt-auto">
                <div class="container-fluid text-center text-muted small">
                    <p class="mb-0">&copy; 2026 Face Recognition Attendance System. All rights reserved.</p>
                </div>
            </footer>
        </div>
    </div>

    <!-- Toast Container for Notifications -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('appSidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            const toggleBtn = document.getElementById('sidebarToggle');

            if (!sidebar || !backdrop || !toggleBtn) {
                return;
            }

            function closeSidebar() {
                sidebar.classList.remove('show');
                backdrop.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            }

            function openSidebar() {
                sidebar.classList.add('show');
                backdrop.classList.add('show');
                document.body.classList.add('sidebar-open');
            }

            toggleBtn.addEventListener('click', () => {
                if (sidebar.classList.contains('show')) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });

            backdrop.addEventListener('click', closeSidebar);

            sidebar.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 992) {
                        closeSidebar();
                    }
                });
            });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 992) {
                    closeSidebar();
                }
            });
        });
    </script>

    <!-- ── PWA: Service Worker Registration + Install Prompt ── -->
    <script>
    // 1. Register service worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('[PWA] Service Worker registered, scope:', reg.scope))
                .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });
    }

    // 2. Capture install prompt
    let _pwaInstallPrompt = null;
    const installBanner = document.getElementById('pwaInstallBanner');
    const installBtn    = document.getElementById('pwaInstallBtn');
    const dismissBtn    = document.getElementById('pwaDismissBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        _pwaInstallPrompt = e;
        // Show banner only if user hasn't dismissed it this session
        if (!sessionStorage.getItem('pwa-dismissed')) {
            installBanner?.classList.remove('d-none');
        }
    });

    // 3. Install button click — trigger native prompt
    installBtn?.addEventListener('click', async () => {
        if (!_pwaInstallPrompt) return;
        installBanner.classList.add('d-none');
        const { outcome } = await _pwaInstallPrompt.prompt();
        console.log('[PWA] Install outcome:', outcome);
        _pwaInstallPrompt = null;
    });

    // 4. Dismiss button — hide for this session
    dismissBtn?.addEventListener('click', () => {
        installBanner?.classList.add('d-none');
        sessionStorage.setItem('pwa-dismissed', '1');
    });

    // 5. Hide banner once user successfully installs
    window.addEventListener('appinstalled', () => {
        installBanner?.classList.add('d-none');
        _pwaInstallPrompt = null;
        console.log('[PWA] FaceAttend installed successfully!');
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
